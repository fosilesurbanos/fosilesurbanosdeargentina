<!DOCTYPE html>
<html lang="es">
<head>
<!-- Cargar tipografía Titillium Web de Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fósiles Urbanos de Argentina</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Leaflet MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🦴 Fósiles Urbanos de Argentina 🐚</h1>
  <p>Un mapa colaborativo de fósiles encontrados en construcciones y espacios urbanos</p>
</header>

<div id="panel-filtros">
  <button id="toggle-panel">🔍 Filtros</button>
  <div id="contenido-filtros" class="oculto">
    <h3>Filtrar Fósiles</h3>
    
    <label for="filtro-organismo">Organismo:</label>
    <select id="filtro-organismo">
      <option value="todos">Todos los organismos</option>
    </select>

    <label for="filtro-autor">Autor:</label>
    <select id="filtro-autor">
      <option value="todos">Todos los autores</option>
    </select>
  </div>
</div>

<div id="map"></div>

<footer>
  Datos recolectados con <a href="https://five.epicollect.net/" target="_blank" rel="noopener">Epicollect5</a> ·
  Mapa hecho con <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a>
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Datos y lógica -->
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
